name: F30 Transform Script Repair

on:
  push:
    branches:
      - 'phase-30-a/storefront-backend-authority'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-30-a/storefront-backend-authority
          fetch-depth: 0
      - name: Repair deterministic transform anchors
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/apply-f30-public-shell-transform.mjs')
          source = path.read_text()
          old = "['              تصاویر مدیریت‌شده محصولات، بسته‌بندی و فرآیند آماده‌سازی', '              {shell.intro}']"
          new = "['            تصاویر مدیریت‌شده محصولات، بسته‌بندی و فرآیند آماده‌سازی', '            {shell.intro}']"
          if old not in source and new not in source:
              raise SystemExit('Gallery transform anchor not found')
          source = source.replace(old, new, 1)

          faq_anchor = "update(\"src/pages/FAQPage.tsx\", (source) => {\n  let next = source;\n"
          faq_patch = "update(\"src/pages/FAQPage.tsx\", (source) => {\n  let next = source;\n  next = replaceOnce(next, 'import { brandConfig, generateWhatsAppUrl, SUPPORT_WHATSAPP_MESSAGE } from \"@/config/brand\";\\n', 'import { generateWhatsAppUrl, SUPPORT_WHATSAPP_MESSAGE } from \"@/config/brand\";\\n', \"FAQ remove static brand import\");\n"
          if faq_anchor in source:
              source = source.replace(faq_anchor, faq_patch, 1)
          elif 'FAQ remove static brand import' not in source:
              raise SystemExit('FAQ transform anchor not found')
          path.write_text(source)
      - name: Syntax check transform
        run: node --check scripts/apply-f30-public-shell-transform.mjs
      - name: Commit transform repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Transform already repaired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply-f30-public-shell-transform.mjs
          git commit -m 'fix(f30): repair public shell transform anchors'
          git push origin HEAD:phase-30-a/storefront-backend-authority
