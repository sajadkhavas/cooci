name: F30 Public Shell Final Repair

on:
  push:
    branches:
      - 'phase-30-a/storefront-backend-authority'

permissions:
  contents: write

jobs:
  repair-transform-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-30-a/storefront-backend-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Repair locations transform anchor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-f30-public-shell-transform.mjs')
          text = path.read_text()
          old = "['                      مشاهده شرایط {city.city}', '                      {shell.cityCtaPrefix} {city.city}']"
          new = "['مشاهده شرایط {city.city}', '{shell.cityCtaPrefix} {city.city}']"
          if old not in text and new not in text:
              raise SystemExit('locations transform anchor definition not found')
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Apply public shell transform
        shell: bash
        run: |
          set +e
          node scripts/apply-f30-public-shell-transform.mjs > f30-public-shell-final-repair.log 2>&1
          status=$?
          cat f30-public-shell-final-repair.log
          echo "$status" > f30-public-shell-final-repair.exit
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f30-public-shell-final-repair-diagnostics
          path: |
            f30-public-shell-final-repair.log
            f30-public-shell-final-repair.exit
          if-no-files-found: error

      - name: Enforce transform result
        run: test "$(cat f30-public-shell-final-repair.exit)" = "0"

      - name: Repair Phase 10.7 audit for backend-driven clarification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/audit-frontend-phase-10-7.mjs')
          text = path.read_text()
          map_anchor = '  storefrontContent: "src/lib/storefront-content.ts",\n'
          map_replacement = map_anchor + '  publicShellContent: "src/lib/public-shell-content.ts",\n'
          if 'publicShellContent: "src/lib/public-shell-content.ts"' not in text:
              if map_anchor not in text:
                  raise SystemExit('Phase10.7 file-map anchor not found')
              text = text.replace(map_anchor, map_replacement, 1)
          old = 'requireText("locationsPage", "وجود شعبه فیزیکی", "visible no-branch clarification");'
          new = 'requireText("locationsPage", "shell.brandInfoDescription", "backend-driven no-branch clarification renderer");\nrequireText("publicShellContent", "وجود صفحه شهر به معنی وجود شعبه فیزیکی در آن شهر نیست.", "no-branch clarification fallback");'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Phase10.7 no-branch audit anchor not found')
          path.write_text(text)
          PY

      - name: Verify transformed authority
        run: |
          npm run typecheck
          npm run test:unit
          node scripts/audit-f30-storefront-authority.mjs
          node scripts/audit-frontend-phase-10-3.mjs
          node scripts/audit-frontend-phase-10-7.mjs

      - name: Commit verified transform
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply-f30-public-shell-transform.mjs scripts/audit-frontend-phase-10-7.mjs src/pages src/components/content/ManagedContentPage.tsx
          git commit -m 'feat(f30): source public page shells from backend authority'
          git fetch origin phase-30-a/storefront-backend-authority
          git rebase origin/phase-30-a/storefront-backend-authority
          git push origin HEAD:phase-30-a/storefront-backend-authority
