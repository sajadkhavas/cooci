name: F30 Category Authority Transform

on:
  push:
    branches:
      - phase-30-a/storefront-backend-authority

permissions:
  contents: write

jobs:
  transform:
    if: ${{ !contains(github.event.head_commit.message, '[f30-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deterministic F30 category authority transform
        run: node scripts/f30-finish-category-authority.mjs
      - name: Remove one-shot transform machinery
        run: |
          rm scripts/f30-finish-category-authority.mjs
          rm .github/workflows/f30-category-authority-transform.yml
      - name: Commit transformed source
        run: |
          if git diff --quiet; then
            echo 'No transform changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[f30-auto] apply backend category authority'
          git push origin HEAD:phase-30-a/storefront-backend-authority
