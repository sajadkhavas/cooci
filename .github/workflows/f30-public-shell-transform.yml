name: F30 Public Shell Authority Transform

on:
  push:
    branches:
      - 'phase-30-a/storefront-backend-authority'

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-30-a/storefront-backend-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply public shell authority transform
        shell: bash
        run: |
          set +e
          node scripts/apply-f30-public-shell-transform.mjs > f30-public-shell-transform.log 2>&1
          status=$?
          echo "$status" > f30-public-shell-transform.exit
          cat f30-public-shell-transform.log
          exit 0
      - name: Upload transform diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f30-public-shell-transform-diagnostics
          path: |
            f30-public-shell-transform.log
            f30-public-shell-transform.exit
          if-no-files-found: error
      - name: Enforce transform result
        run: test "$(cat f30-public-shell-transform.exit)" = "0"
      - name: Verify transformed authority
        run: |
          npm run typecheck
          npm run test:unit
          node scripts/audit-f30-storefront-authority.mjs
          node scripts/audit-frontend-phase-10-3.mjs
          node scripts/audit-frontend-phase-10-7.mjs
      - name: Commit transform
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages src/components/content/ManagedContentPage.tsx
          git commit -m 'feat(f30): source public page shells from backend authority'
          git push origin HEAD:phase-30-a/storefront-backend-authority
