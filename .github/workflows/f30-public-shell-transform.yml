name: F30 Public Shell Authority Transform

on:
  push:
    branches:
      - 'phase-30-a/storefront-backend-authority'

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-30-a/storefront-backend-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply public shell authority transform
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, marker=None):
              p = Path(path)
              s = p.read_text()
              if old in s:
                  p.write_text(s.replace(old, new, 1))
                  return
              if marker and marker in s:
                  return
              raise SystemExit(f'{path}: expected transform anchor not found')

          # Products index shell only; category landings remain domain authoritative.
          path = 'src/pages/ProductsPage.tsx'
          replace_once(path,
              'import { useCatalogDirectory } from "@/hooks/useCatalogDirectory";\n',
              'import { useCatalogDirectory } from "@/hooks/useCatalogDirectory";\nimport { usePublicShellContent } from "@/hooks/usePublicShellContent";\n',
              'usePublicShellContent')
          replace_once(path,
              '  const [searchParams, setSearchParams] = useSearchParams();\n  const { categories, landings, isLoading: categoriesLoading } = useCatalogDirectory();',
              '  const [searchParams, setSearchParams] = useSearchParams();\n  const shell = usePublicShellContent().catalog;\n  const { categories, landings, isLoading: categoriesLoading } = useCatalogDirectory();',
              'const shell = usePublicShellContent().catalog;')
          replace_once(path,
'''  const name = isFilteredEditorialCategory
    ? content?.name || "محصولات وینیمی"
    : backendCategory?.name || content?.name || "محصولات وینیمی";
  const heading = isFilteredEditorialCategory
    ? content?.heading || name
    : backendCategory?.name || content?.heading || name;
  const intro = isFilteredEditorialCategory
    ? content?.intro || "محصولات این مجموعه را بررسی کن."
    : backendCategory?.description ||
      content?.intro ||
      "محصول موردنظرت را با دسته‌بندی، جست‌وجو، مرتب‌سازی و فیلترهای فروشگاه پیدا کن.";
  const seoTitle = isFilteredEditorialCategory
    ? content?.seoTitle || name
    : backendCategory?.seo.title ||
      content?.seoTitle ||
      (backendCategory ? `خرید ${backendCategory.name}` : "محصولات");
  const seoDescription = isFilteredEditorialCategory
    ? content?.seoDescription || intro
    : backendCategory?.seo.description ||
      backendCategory?.description ||
      content?.seoDescription ||
      "مشاهده، جست‌وجو، فیلتر و خرید آنلاین محصولات فعال وینیمی با قیمت و موجودی دریافت‌شده از سرور.";
''',
'''  const name = slug
    ? isFilteredEditorialCategory
      ? content?.name || shell.heading
      : backendCategory?.name || content?.name || shell.heading
    : shell.heading;
  const heading = slug
    ? isFilteredEditorialCategory
      ? content?.heading || name
      : backendCategory?.name || content?.heading || name
    : shell.heading;
  const intro = slug
    ? isFilteredEditorialCategory
      ? content?.intro || shell.intro
      : backendCategory?.description || content?.intro || shell.intro
    : shell.intro;
  const seoTitle = slug
    ? isFilteredEditorialCategory
      ? content?.seoTitle || name
      : backendCategory?.seo.title ||
        content?.seoTitle ||
        (backendCategory ? `خرید ${backendCategory.name}` : shell.metaTitle)
    : shell.metaTitle;
  const seoDescription = slug
    ? isFilteredEditorialCategory
      ? content?.seoDescription || intro
      : backendCategory?.seo.description ||
        backendCategory?.description ||
        content?.seoDescription ||
        shell.metaDescription
    : shell.metaDescription;
''', 'const seoTitle = slug')
          replace_once(path,
              '              title="دسته را انتخاب کن یا با فیلترها میان همه محصولات بگرد"\n              description="هر دسته یک URL مستقل و قابل اشتراک دارد، اما انتخاب، فیلتر، مرتب‌سازی و محصولات همگی داخل همین فروشگاه باقی می‌مانند."',
              '              title={shell.categoriesTitle}\n              description={shell.categoriesDescription}',
              'title={shell.categoriesTitle}')
          replace_once(path,
              '                  همه محصولات\n                </Link>',
              '                  {shell.allProductsLabel}\n                </Link>',
              '{shell.allProductsLabel}')

          # Blog index shell.
          path = 'src/pages/BlogListPage.tsx'
          replace_once(path,
              'import { SEO } from "@/components/SEO";\n',
              'import { SEO } from "@/components/SEO";\nimport { usePublicShellContent } from "@/hooks/usePublicShellContent";\n',
              'usePublicShellContent')
          replace_once(path,
              '  const loaderData = useLoaderData() as PublicSsrLoaderData | undefined;\n',
              '  const loaderData = useLoaderData() as PublicSsrLoaderData | undefined;\n  const shell = usePublicShellContent().blogIndex;\n',
              'usePublicShellContent().blogIndex')
          replace_once(path,
'''  const title = "راهنماهای وینیمی";
  const description =
    "مقاله‌های منتشرشده وینیمی در موضوعات واقعی فروشگاه برای انتخاب، سفارش و نگهداری آگاهانه‌تر.";
''',
'''  const title = shell.heading;
  const description = shell.intro;
''', 'const title = shell.heading;')
          replace_once(path,
              '        title={title}\n        description={description}',
              '        title={shell.metaTitle}\n        description={shell.metaDescription}',
              'title={shell.metaTitle}')

          # Contact shell.
          path = 'src/pages/ContactPage.tsx'
          replace_once(path,
              'import { useStorefrontSettings } from "@/hooks/useStorefrontSettings";\n',
              'import { usePublicShellContent } from "@/hooks/usePublicShellContent";\nimport { useStorefrontSettings } from "@/hooks/useStorefrontSettings";\n',
              'usePublicShellContent')
          replace_once(path,
              '  const { settings } = useStorefrontSettings();\n',
              '  const { settings } = useStorefrontSettings();\n  const shell = usePublicShellContent().contact;\n',
              'usePublicShellContent().contact')
          replacements = [
            ('title="تماس با ما"', 'title={shell.metaTitle}'),
            ('description="راه‌های ارتباط رسمی با وینیمی و فرم امن ثبت درخواست پشتیبانی و همکاری."', 'description={shell.metaDescription}'),
            ('<h1 className="heading-1 text-foreground">تماس با ما</h1>', '<h1 className="heading-1 text-foreground">{shell.heading}</h1>'),
            ('برای پشتیبانی، همکاری یا پیگیری، درخواست خود را ثبت کنید تا در پنل\n            فروشگاه قابل پیگیری باشد.', '{shell.intro}'),
            ('<h2 className="font-semibold">تلفن رسمی</h2>', '<h2 className="font-semibold">{shell.phoneTitle}</h2>'),
            ('<h2 className="font-semibold">ایمیل رسمی</h2>', '<h2 className="font-semibold">{shell.emailTitle}</h2>'),
            ('<h2 className="font-semibold">محدوده اعلام‌شده برند</h2>', '<h2 className="font-semibold">{shell.locationTitle}</h2>'),
            ('مشاهده محدوده در نقشه', '{shell.mapLabel}'),
            ('<h2 className="font-semibold">ساعات پاسخ‌گویی</h2>', '<h2 className="font-semibold">{shell.hoursTitle}</h2>'),
            ('بازه دقیق و ثابت اعلام نشده است؛ هماهنگی از مسیرهای رسمی\n                    انجام می‌شود.', '{shell.hoursNote}'),
            ('مناطق منتشرشده ارسال', '{shell.locationsCtaLabel}'),
            ('شروع سفارش از فروشگاه', '{shell.shopCtaLabel}'),
            ('اینستاگرام رسمی', '{shell.instagramLabel}'),
            ('title="ثبت درخواست تماس"', 'title={shell.inquiryTitle}'),
            ('description="پیام شما در بک‌اند ذخیره می‌شود و تیم فروشگاه می‌تواند آن را در پنل مدیریت بررسی و پیگیری کند."', 'description={shell.inquiryDescription}'),
            ('subjectLabel="موضوع درخواست"', 'subjectLabel={shell.inquirySubjectLabel}'),
            ('messageLabel="پیام شما"', 'messageLabel={shell.inquiryMessageLabel}'),
          ]
          for old, new in replacements:
              replace_once(path, old, new, new)

          # FAQ shell; FAQ records themselves remain BakeryFaq authoritative.
          path = 'src/pages/FAQPage.tsx'
          replace_once(path,
              'import { SEO } from "@/components/SEO";\n',
              'import { SEO } from "@/components/SEO";\nimport { usePublicShellContent } from "@/hooks/usePublicShellContent";\n',
              'usePublicShellContent')
          replace_once(path,
              '  const [openId, setOpenId] = useState<number | null>(null);\n',
              '  const [openId, setOpenId] = useState<number | null>(null);\n  const shell = usePublicShellContent().faq;\n',
              'usePublicShellContent().faq')
          for old, new in [
            ('<SEO title="سوالات متداول" description="پاسخ‌های منتشرشده فروشگاه درباره سفارش، پرداخت، ارسال و محصولات." schema={schema} />', '<SEO title={shell.metaTitle} description={shell.metaDescription} schema={schema} />'),
            ('<h1 className="heading-1 text-foreground">سوالات متداول</h1>', '<h1 className="heading-1 text-foreground">{shell.heading}</h1>'),
            ('<p className="body-large mt-4 text-muted-foreground">پاسخ‌های مدیریت‌شده {brandConfig.brandName}</p>', '<p className="body-large mt-4 text-muted-foreground">{shell.intro}</p>'),
            ('>همه</button>', '>{shell.allLabel}</button>'),
            ('<h2 className="heading-3 mb-2">پاسخ سوال‌تان را نیافتید؟</h2>', '<h2 className="heading-3 mb-2">{shell.supportTitle}</h2>'),
            ('<MessageCircle size={18} aria-hidden="true" />پشتیبانی واتساپ</a>', '<MessageCircle size={18} aria-hidden="true" />{shell.whatsappLabel}</a>'),
            ('className="btn-primary rounded-xl px-6 py-3 font-medium">ثبت درخواست تماس</Link>', 'className="btn-primary rounded-xl px-6 py-3 font-medium">{shell.contactLabel}</Link>'),
          ]:
              replace_once(path, old, new, new)

          # Gallery shell.
          path = 'src/pages/GalleryPage.tsx'
          replace_once(path,
              'import { SEO } from "@/components/SEO";\n',
              'import { SEO } from "@/components/SEO";\nimport { usePublicShellContent } from "@/hooks/usePublicShellContent";\n',
              'usePublicShellContent')
          replace_once(path,
              '  const loaderData = useLoaderData() as PublicSsrLoaderData | undefined;\n',
              '  const loaderData = useLoaderData() as PublicSsrLoaderData | undefined;\n  const shell = usePublicShellContent().gallery;\n',
              'usePublicShellContent().gallery')
          for old, new in [
            ('title="گالری"', 'title={shell.metaTitle}'),
            ('description="تصاویر منتشرشده وینیمی از منبع محتوای فروشگاه."', 'description={shell.metaDescription}'),
            ('<h1 className="heading-1">گالری تصاویر</h1>', '<h1 className="heading-1">{shell.heading}</h1>'),
            ('تصاویر مدیریت‌شده محصولات، بسته‌بندی و فرآیند آماده‌سازی', '{shell.intro}'),
          ]:
              replace_once(path, old, new, new)

          # Locations shell + global backend contact/brand authority.
          path = 'src/pages/LocationsPage.tsx'
          replace_once(path,
              'import { brandConfig, generatePhoneUrl } from "@/config/brand";\n',
              'import { brandConfig } from "@/config/brand";\nimport { usePublicShellContent } from "@/hooks/usePublicShellContent";\nimport { useStorefrontSettings } from "@/hooks/useStorefrontSettings";\n',
              'usePublicShellContent')
          replace_once(path,
              '  const loaderData = useLoaderData() as PublicSsrLoaderData | undefined;\n  const cities = loaderData?.cities ?? [];\n  const title = "مناطق منتشرشده ارسال وینیمی";\n  const description =\n    "صفحه‌های رسمی و منتشرشده وینیمی برای بررسی شرایط سفارش و ارسال در هر شهر؛ محدوده و روش نهایی تحویل در Checkout تأیید می‌شود.";\n',
              '  const loaderData = useLoaderData() as PublicSsrLoaderData | undefined;\n  const cities = loaderData?.cities ?? [];\n  const shell = usePublicShellContent().locations;\n  const { settings } = useStorefrontSettings();\n  const title = shell.heading;\n  const description = shell.intro;\n',
              'usePublicShellContent().locations')
          replace_once(path,
              '        title={title}\n        description={description}',
              '        title={shell.metaTitle}\n        description={shell.metaDescription}',
              'title={shell.metaTitle}')
          for old, new in [
            ('صفحات محلی مدیریت‌شده', '{shell.eyebrow}'),
            ('مشاهده شرایط {city.city}', '{shell.cityCtaPrefix} {city.city}'),
            ('<h2 className="heading-2 mb-4">اطلاعات ثابت برند</h2>', '<h2 className="heading-2 mb-4">{shell.brandInfoTitle}</h2>'),
            ('این اطلاعات برای شناسایی و ارتباط با {brandConfig.brandName} در همه\n                صفحه‌ها یکسان است. وجود صفحه شهر به معنی وجود شعبه فیزیکی در آن شهر\n                نیست.', '{shell.brandInfoDescription}'),
            ('{brandConfig.address}', '{settings.contact.address}'),
            ('href={generatePhoneUrl()}', 'href={settings.contact.phoneUrl}'),
            ('{brandConfig.phone}', '{settings.contact.phone}'),
            ('href={`mailto:${brandConfig.email}`}', 'href={`mailto:${settings.contact.email}`}'),
            ('{brandConfig.email}', '{settings.contact.email}'),
          ]:
              replace_once(path, old, new, new)

          # Reviews shell + global backend brand authority for schema.
          path = 'src/pages/ReviewsPage.tsx'
          replace_once(path,
              'import { SEO } from "@/components/SEO";\n',
              'import { SEO } from "@/components/SEO";\nimport { usePublicShellContent } from "@/hooks/usePublicShellContent";\nimport { useStorefrontSettings } from "@/hooks/useStorefrontSettings";\n',
              'usePublicShellContent')
          replace_once(path,
              '  const loaderData = useLoaderData() as PublicSsrLoaderData | undefined;\n',
              '  const loaderData = useLoaderData() as PublicSsrLoaderData | undefined;\n  const shell = usePublicShellContent().reviews;\n  const { settings } = useStorefrontSettings();\n',
              'usePublicShellContent().reviews')
          for old, new in [
            ('name: brandConfig.brandName,', 'name: settings.brand.name,'),
            ('title="نظرهای تأییدشده مشتریان"', 'title={shell.metaTitle}'),
            ('description="نظرهای خرید تأییدشده و منتشرشده از بک‌اند وینیمی."', 'description={shell.metaDescription}'),
            ('{ name: "نظرهای مشتریان" }', '{ name: shell.breadcrumbLabel }'),
            ('<h1 className="heading-1 mb-4">نظرهای تأییدشده مشتریان</h1>', '<h1 className="heading-1 mb-4">{shell.heading}</h1>'),
            ('فقط نظرهای تأییدشده مرتبط با سفارش تحویل‌شده نمایش داده می‌شوند.', '{shell.intro}'),
          ]:
              replace_once(path, old, new, new)

          # Managed page business CTAs; page content/meta remain BakeryContentPage authoritative.
          path = 'src/components/content/ManagedContentPage.tsx'
          replace_once(path,
              'import { SEO } from "@/components/SEO";\n',
              'import { SEO } from "@/components/SEO";\nimport { usePublicShellContent } from "@/hooks/usePublicShellContent";\n',
              'usePublicShellContent')
          replace_once(path,
              '  const loaderData = useLoaderData() as PublicSsrLoaderData | undefined;\n',
              '  const loaderData = useLoaderData() as PublicSsrLoaderData | undefined;\n  const shell = usePublicShellContent().managedPage;\n',
              'usePublicShellContent().managedPage')
          for old, new in [
            ('<h2 className="text-base font-black text-foreground">\n                مسیرهای مرتبط\n              </h2>', '<h2 className="text-base font-black text-foreground">\n                {shell.relatedTitle}\n              </h2>'),
            ('مشاهده محصولات', '{shell.productsLabel}'),
            ('تماس با پشتیبانی', '{shell.contactLabel}'),
            ('درباره محصولات یا شرایط سفارش سؤال دارید؟', '{shell.finalTitle}'),
            ('اطلاعات نهایی هر محصول و وضعیت سفارش را پیش از ثبت درخواست بررسی\n                کنید.', '{shell.finalDescription}'),
            ('ارتباط با وینیمی', '{shell.finalContactLabel}'),
            ('ورود به فروشگاه', '{shell.finalShopLabel}'),
          ]:
              replace_once(path, old, new, new)

      - name: Verify transformed authority
        run: |
          npm run typecheck
          npm run test:unit
          node scripts/audit-f30-storefront-authority.mjs
          node scripts/audit-frontend-phase-10-3.mjs
      - name: Commit transform
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages src/components/content/ManagedContentPage.tsx
          git commit -m 'feat(f30): source public page shells from backend authority'
          git push origin HEAD:phase-30-a/storefront-backend-authority
