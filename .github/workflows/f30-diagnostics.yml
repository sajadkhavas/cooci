name: F30 Unit Diagnostics

on:
  push:
    branches:
      - 'phase-30-a/storefront-backend-authority'

permissions:
  contents: read

jobs:
  unit-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture unit regression
        shell: bash
        run: |
          set +e
          npm run test:unit > f30-unit.log 2>&1
          status=$?
          echo "$status" > f30-unit.exit
          cat f30-unit.log
          exit 0
      - name: Upload unit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f30-unit-diagnostics
          path: |
            f30-unit.log
            f30-unit.exit
          if-no-files-found: error
      - name: Enforce unit result
        shell: bash
        run: test "$(cat f30-unit.exit)" = "0"
